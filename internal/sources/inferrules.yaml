# asname's own rules for what kind of network an AS is, applied when the
# category database is built. They add tags the other sources (PeeringDB,
# bgp.tools, cloud and VPN lists) may lack; lookups show them as inferred,
# alongside those sources' tags, never in place of them.
#
# Accuracy over coverage: a word is listed only when, measured against every
# AS that PeeringDB or bgp.tools also describe, it picks out the kind of
# network it claims nearly every time: run
#   ASNAME_INFER_EVAL=~/.asname go test ./internal/sources -run InferRulesAgainstReference -v
# after any change (the README's "Network categories" has the results).
#
# Matching is on the organisation part of the AS name ("Comcast Cable
# Communications, LLC"), not the handle ("COMCAST-7922"): enterprises name
# their own data-centre networks "-COLO" or "-HOSTING" without being hosts.
# Words are whole words, case-insensitive; a trailing * matches any ending
# (universi* covers university, universidad, universität); a space matches
# any run of spaces.

words:
  telecom: [telecom*, telekom*, telecomunica*, telecommunication*, telekomunik*, telecomunicaç*, broadband,
    internet service provider, isp, provedor, provedor de internet, fibra, fibre, fiber, wisp, cablevision,
    cable tv, cable communications]
  hosting: [hosting, webhosting, web hosting, data center, data centers, data centre, data centres, datacenter,
    datacenters, datacentre, datacentres, colocation, vps, dedicated server, dedicated servers, hospedagem]
  education: [universi*, üniversitesi, egyetem, uniwersytet, univerzita, yliopisto, college, polytechnic*,
    politecnico, hochschule, school district, public schools, institute of technology, research and education network,
    academy of sciences, instituto federal, k12, k-12]
  government_strong: [ministry, ministerio, ministère, ministere, bundesministerium, gobierno, governo, prefeitura,
    municipality, municipalidad, city of, county of, town of, parliament, senado, police, gemeente, ayuntamiento,
    regulatory authority, regulatory commission]
  government: [government, department of, secretaria, district court, courts]
  finance: [bank, banco, banque, bancorp, credit union, sparkasse, volksbank, stock exchange, insurance, assurance,
    versicherung, seguros, savings]
  central_bank: [central bank, reserve bank, banco central, banque centrale, national bank of, bank of england,
    bundesbank]
  healthcare: [hospital*, medical center, medical centre, health system, healthcare, health care, clinic, klinikum,
    hospitais, hospitalar]
  mobile: [mobile, cellular, mobil, móvil, movil]
  mobile_context: [telecom*, telekom*, telecommunication*, communication, communications, network, networks, operator,
    cellular, gsm]
  mobile_not: [molecular, tracking, health*, access, app, apps, game, games, payment, payments, banking, device,
    devices]
  subsidiary: [subsidiary, subsidiary of, a subsidiary]
  exchange: [internet exchange, exchange point, ix, ixp, association, asociación, asociacion, associação, associacao, peering]

# What kind of organisation the AS belongs to: the first rule that matches
# decides, and an AS has at most one. "Federal" is deliberately absent: it
# names universities (Universidade Federal) and credit unions as often as
# governments.
kinds:
  - {tag: finance, match: [finance], not: [telecom, hosting, subsidiary]}
  - {tag: government, match: [government_strong]}
  - {tag: education, match: [education]}
  - {tag: healthcare, match: [healthcare], not: [telecom, hosting]}
  - {tag: government, match: [government]}

# What the network does, added independently. no_kind: only when no kind
# above matched (a university's "data center" is not a hosting company).
services:
  - {tag: hosting, match: [hosting], not_kinds: [education, government]}
  - {tag: isp, match: [telecom], not: [exchange], no_kind: true}
  - {tag: mobile, match: [mobile, mobile_context], not: [mobile_not], no_kind: true}
  - {tag: government, match: [central_bank]}

